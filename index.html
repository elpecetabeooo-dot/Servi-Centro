<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Servi Centro - Registro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="logo.jpeg" alt="Logo Servi Centro">
    <h1>Servi Centro</h1>
  </header>

  <main class="login">
    <h2>Crear cuenta</h2>
    <form id="registerForm">
      <input type="text" id="nuevoUsuario" placeholder="Nuevo usuario" required>
      <input type="password" id="nuevaContraseña" placeholder="Nueva contraseña" required>
      <button type="submit">Registrar y entrar</button>
    </form>
  </main>

  <footer>
    <p>© 2026 Servi Centro</p>
  </footer>

  <!-- Script al final -->
  <script src="script.js"></script>
</body>
</html>
